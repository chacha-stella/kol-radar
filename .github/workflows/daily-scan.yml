name: Daily mailbox scan

on:
  workflow_dispatch:
  schedule:
    - cron: '30 0 * * *'

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dashboard
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install mail client
        run: npm install --no-audit --no-fund
      - name: Scan Aliyun Enterprise Mail
        env:
          MAIL_IMAP_HOST: imap.qiye.aliyun.com
          MAIL_IMAP_PORT: 993
          MAIL_IMAP_USER: ${{ secrets.MAIL_IMAP_USER }}
          MAIL_IMAP_PASSWORD: ${{ secrets.MAIL_IMAP_PASSWORD }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: |
          if [ "$MAIL_IMAP_USER" != "stella.zhuang@chessnutech.com" ]; then
            echo "MAIL_IMAP_USER is not the configured stella.zhuang@chessnutech.com account. Update the GitHub secret." >&2
            exit 1
          fi
          node scripts/scan-email.js
      - name: Publish aggregate digest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/digest.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: update daily email digest"
          # Rebase onto a concurrent workflow update before retrying the push.
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            sleep 2
          done
          echo "Could not publish digest after three attempts." >&2
          exit 1
